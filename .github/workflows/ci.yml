name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yuflixtest
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: yuflixtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuflixtest -d yuflixtest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/core/go.sum
      - run: go test -race ./...
        working-directory: services/core
        env:
          # Disposable database started by this CI job.
          YUFLIX_TEST_DATABASE_URL: postgres://yuflixtest:ephemeral_ci_only@127.0.0.1:5432/yuflixtest?sslmode=disable
      - run: go vet ./...
        working-directory: services/core
      - run: test -z "$(gofmt -l .)"
        working-directory: services/core
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
