openapi: 3.1.0
info:
  title: YuFlix API
  version: 0.2.0
  description: Experimental automatic MP4 playback with authenticated scoped tickets. HLS and transcoding remain unavailable.
servers:
  - url: /api/v1
paths:
  /system/info:
    get:
      summary: Public, non-sensitive instance status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /catalog/sources:
    get:
      summary: List shared public Stremio catalog sources
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Safe source names and catalog IDs without manifest URLs}
        '401': {description: Login required}
  /catalog/sources/{sourceID}/items:
    get:
      summary: Fetch catalog metadata and posters, not streams
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: true, schema: {type: string, enum: [movie, series]}}
        - {name: catalog, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Non-playback metadata}
        '502': {description: Provider unavailable}
  /catalog/sources/{sourceID}/meta:
    get:
      summary: Fetch Stremio title metadata
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: true, schema: {type: string, enum: [movie, series]}}
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Title metadata only}
  /admin/catalog/sources:
    post:
      summary: Register a public Stremio catalog (admin)
      security: [{sessionCookie: []}]
      responses:
        '201': {description: Source registered}
        '422': {description: Invalid or unsupported manifest}
  /admin/catalog/sources/{sourceID}:
    delete:
      summary: Remove a shared public catalog source (admin)
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
  /admin/media/streams:
    get:
      summary: Discover candidate progressive MP4 streams without exposing provider URLs
      security: [{sessionCookie: []}]
      parameters:
        - {name: type, in: query, required: true, schema: {type: string, enum: [movie, series]}}
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Candidate list only, not proof of successful playback}
        '429': {description: Too many concurrent source checks}
  /admin/media/sessions:
    post:
      summary: Probe a selected public MP4 and issue a user-scoped temporary streaming session
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, type, id, index, candidateKey]
              properties:
                sourceId: {type: string, format: uuid}
                type: {type: string, enum: [movie, series]}
                id: {type: string}
                index: {type: integer, minimum: 0, maximum: 11}
                candidateKey: {type: string, description: Opaque binding returned by stream discovery}
      responses:
        '201': {description: Short MP4 probe passed, with an opaque same-origin play path}
        '422': {description: MP4 or HTTP Range verification failed}
        '429': {description: Concurrent or ticket capacity limit}
  /media/auto:
    post:
      summary: Pick an authorized, supported playback source automatically without exposing addons
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id, attempt]
              properties:
                type: {type: string, enum: [movie, series]}
                id: {type: string}
                attempt: {type: integer, minimum: 0, maximum: 7}
      responses:
        '201': {description: Scoped temporary playback ticket with a same-origin path}
        '404': {description: No source configured}
        '422': {description: No compatible source could be verified}
        '429': {description: Concurrent requests limited}
        '504': {description: Search time budget exceeded}
  /media/play/{token}:
    get:
      summary: Stream authorized progressive MP4 with support for single byte ranges
      security: [{sessionCookie: []}]
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
        - {name: Range, in: header, required: false, schema: {type: string}}
      responses:
        '200': {description: MP4 body from source, if no Range specified}
        '206': {description: Partial MP4 content with Content-Range}
        '401': {description: Login required}
        '404': {description: Ticket invalid or belongs to another user}
        '416': {description: Invalid or multiple byte ranges}
  /admin/media/addons:
    get:
      summary: Administrator-only list of stream addons and source policies
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Addon name, ID, priority, timeout and network route}
    post:
      summary: Validate and register a public Stremio stream manifest (admin)
      security: [{sessionCookie: []}]
      responses:
        '201': {description: Shared stream addon registered}
        '422': {description: No supported stream resource}
  /admin/media/addons/{sourceID}:
    delete:
      summary: Remove stream provider (admin)
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Stream addon removed}
  /admin/network/egress:
    get:
      summary: Show which stream addons have an authorized private egress (admin)
      description: Never returns egress addresses, secrets or private provider manifest URLs.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Map of addon IDs to egress availability}
        '403': {description: Administrator access required}
  /admin/catalog/sources/{sourceID}/cache:
    put:
      summary: Set per-catalog cache mode (admin)
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [off, on-demand, precache]}
      responses:
        '200': {description: Updated source cache mode}
  /admin/catalog/cache:
    put:
      summary: Apply a cache mode to all catalog sources (admin)
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Updated safe catalog source summaries}
  /admin/media/addons/{sourceID}/policy:
    put:
      summary: Set priority and timeout for one stream addon (admin)
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [priority, timeoutMs]
              properties:
                priority: {type: integer, minimum: 1, maximum: 1000}
                timeoutMs: {type: integer, minimum: 1000, maximum: 10000}
      responses:
        '200': {description: Policy saved}
        '400': {description: Invalid range}
  /admin/media/addons/{sourceID}/route:
    put:
      summary: Select Direct, private egress, or Automatic networking for one stream addon (admin)
      security: [{sessionCookie: []}]
      parameters:
        - {name: sourceID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route: {type: string, enum: [direct, egress, auto]}
      responses:
        '200': {description: Route saved in PostgreSQL; previous tickets revoked}
        '400': {description: Invalid mode or input}
        '403': {description: Administrator access required}
        '404': {description: Stream addon not found}
        '409': {description: No authorized egress for this addon}
  /auth/login:
    post:
      summary: Log in with an individual username and password
      description: >
        Requires a migrated database and an explicitly allowed request origin.
        HTTPS is recommended. HTTP login is available only with explicit
        administrator opt-in and an allowlisted HTTP origin; traffic is not encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Secure cookie session established}
        '401': {description: Invalid credentials}
        '403': {description: Protocol or request origin not authorized}
        '429': {description: Rate limited}
        '503': {description: Database not activated}
  /auth/me:
    get:
      summary: Current account
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Account information}
        '401': {description: Unauthorized}
  /auth/logout:
    post:
      summary: Revoke current session
      security: [{sessionCookie: []}]
      responses:
        '204': {description: Signed out}
  /admin/users:
    get:
      summary: List users (admin)
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Users}
        '403': {description: Not administrator}
    post:
      summary: Add independent user (admin)
      security: [{sessionCookie: []}]
      responses:
        '201': {description: Created}
        '403': {description: Not administrator}
  /admin/settings:
    get:
      summary: Read stored preferences (admin)
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Preferences}
  /admin/settings/{key}:
    put:
      summary: Store a supported preference (admin)
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
      responses:
        '200': {description: Stored preference}
        '400': {description: Invalid value}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yuflix_session
  schemas:
    SystemInfo:
      type: object
      required: [name, slogan, apiVersion, phase, playbackReady, databaseReady, authenticationReady]
      properties:
        name: {type: string, const: YuFlix}
        slogan: {type: string}
        apiVersion: {type: string, const: v1}
        phase: {type: string}
        playbackReady: {type: boolean, const: false}
        databaseReady: {type: boolean}
        authenticationReady: {type: boolean}
